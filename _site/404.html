    <style>
        body {
            /* Set Crimson Text as the default font for all body text */
            font-family: 'Inter', serif;
            background-color: #f8fafc; /* Light blue-gray background */
        }
        /* Apply Playfair Display to all headings for a consistent heading style */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Inter', serif;
        }
        /* Ensure Inter is still available for other elements if needed, though 'body' is now Crimson */
        .font-inter {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Border Styling for Posts (no changes here) */
        .post-border-wrapper {
            position: relative;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow: hidden;
        }

        .post-border-wrapper::before,
        .post-border-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: inherit;
            z-index: -1;
        }

        .post-border-wrapper::before {
            background: linear-gradient(45deg, #a78bfa, #8b5cf6, #6d28d9);
            opacity: 0.6;
            filter: blur(8px);
            transform: scale(1.03);
        }

        .post-border-wrapper::after {
            background: linear-gradient(45deg, #c4b5fd, #a78bfa);
            top: 0.5rem;
            left: 0.5rem;
            right: 0.5rem;
            bottom: 0.5rem;
            opacity: 0.8;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* Slideshow styles (no changes here) */
        .slideshow-container {
            max-width: 1000px;
            position: relative;
            margin: auto;
        }

        .mySlides {
            display: none;
        }

        .mySlides img {
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .text {
            color: #f2f2f2;
            font-size: 15px;
            padding: 8px 12px;
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
            border-bottom-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
        }

        .numbertext {
            color: #f2f2f2;
            font-size: 12px;
            padding: 8px 12px;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.5);
            border-top-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
        }

        .dot {
            cursor: pointer;
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }

        .active, .dot:hover {
            background-color: #717171;
        }

        .fade {
            animation-name: fade;
            animation-duration: 1.5s;
        }

        @keyframes fade {
            from {opacity: .4}
            to {opacity: 1}
        }
    </style>
