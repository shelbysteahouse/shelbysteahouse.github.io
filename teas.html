---
layout: default
---
<article class="p-6 bg-gray-50 rounded-lg shadow-inner">
    <h2 class="text-3xl font-semibold mb-4 text-green-700">Teas that I serve (茶)</h3>
        {% assign categoties = site.teas | group_by: "category" %}

        {% for c in categoties %}
        <h4 class="text-2xl font-semibold mb-4 text-black-600">{{ c.name }}</h4>
        <ul>
            {% for tea in c.items %}
            <li>
                <article class="bg-white p-6 rounded-lg shadow hover:shadow-lg transition duration-300">
                    <h3 class="text-2xl font-bold text-blue-800 mb-2">
                        <a href="{{ tea.url | relative_url }}" class="hover:text-blue-600">{{ tea.title }}</a>
                    </h3>
                </article>
            </li>
            {% endfor %}
        </ul>
        {% endfor %}

        {% include textme.html %}

</article>
